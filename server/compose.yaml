name: podcast_ad_trim

services:
  flask:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${HOST_PORT}:80
    volumes:
      - ${STORAGE_PATH}:/home/appuser/storage
      - ${LOG_FILE}:/home/appuser/audio_detection_service.log
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:80/health || exit 1"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3